name: visual-haskell-analysis-ghc910
version: 0.1.0.0
synopsis: Direct GHC 9.10 analysis worker for Visual Haskell
description: Uses hie-bios for component discovery and isolates the GHC 9.10 API behind a worker-private compatibility module.
category: Development
github: aantich/haskelui
license: BSD-3-Clause
author: Visual Haskell contributors
maintainer: Visual Haskell contributors
copyright: 2026 Visual Haskell contributors

dependencies:
  - async
  - aeson
  - bytestring
  - base >= 4.18.3 && < 4.21
  - containers
  - directory
  - filepath
  - filelock
  - temporary
  - ghc >= 9.6.7 && < 9.11
  - ghc-boot
  - hie-bios >= 0.21 && < 0.22
  - mtl
  - stm
  - text
  - template-haskell
  - time
  - unix
  - visual-haskell-analysis-protocol
  - visual-haskell-semantic-model
  - visual-haskell-projects

ghc-options:
  - -Wall
  - -Wcompat

library:
  source-dirs: src
  exposed-modules:
    - VisualHaskell.Analysis.Ghc910
    - VisualHaskell.Analysis.Ghc910.Version
  other-modules:
    - VisualHaskell.Analysis.Ghc910.Compat
    - VisualHaskell.Analysis.Ghc910.Engine
    - VisualHaskell.Analysis.Ghc910.Project
    - VisualHaskell.Analysis.Ghc910.Types

executables:
  visual-haskell-analysis-ghc910:
    main: Main.hs
    source-dirs: app
    dependencies:
      - visual-haskell-analysis-ghc910
      - visual-haskell-analysis-client
      - fsnotify
    ghc-options:
      - -threaded
  visual-haskell-project-loading-spike:
    main: Main.hs
    source-dirs: spike
    dependencies:
      - aeson
      - bytestring
      - ghc-boot
      - process
      - temporary
      - visual-haskell-analysis-ghc910
    ghc-options:
      - -threaded
  visual-haskell-project-loading-check:
    main: Main.hs
    source-dirs: integration
    dependencies: [temporary, visual-haskell-analysis-ghc910, visual-haskell-analysis-client]
    ghc-options: [-threaded]

tests:
  visual-haskell-analysis-ghc-910-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - stm
      - visual-haskell-analysis-client
      - visual-haskell-analysis-ghc910
    ghc-options:
      - -threaded

extra-source-files:
  - test/fixtures/two-module/hie.yaml
  - test/fixtures/two-module/A.hs
  - test/fixtures/two-module/B.hs
  - test/fixtures/project-loading/**/*.cabal
  - test/fixtures/project-loading/**/*.hs
  - test/fixtures/project-loading/cabal.project
  - test/fixtures/project-loading/stack.yaml
  - test/fixtures/project-variants/**/*.hs
  - test/fixtures/project-variants/*.cabal
  - test/fixtures/project-custom/**/*.hs
  - test/fixtures/project-custom/*.hs
  - test/fixtures/project-custom/*.cabal
