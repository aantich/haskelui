name: visual-haskell
version: 0.1.0.0
github: aantich/haskelui
license: BSD-3-Clause
author: HaskeLUI contributors
maintainer: HaskeLUI contributors
copyright: 2026 HaskeLUI contributors

dependencies:
  - aeson
  - async
  - base >= 4.20.2 && < 4.21
  - bytestring
  - containers
  - directory
  - filepath
  - text
  - time
  - haskelui-core
  - visual-haskell-analysis-client
  - visual-haskell-analysis-protocol
  - visual-haskell-semantic-model
  - visual-haskell-textmate

library:
  source-dirs: src
  exposed-modules:
    - VisualHaskell
    - VisualHaskell.Analysis.Service
    - VisualHaskell.Diagnostics
    - VisualHaskell.Highlighting
    - VisualHaskell.Logging
    - VisualHaskell.Paths
    - VisualHaskell.TrustState
    - VisualHaskell.WorkspaceState

executables:
  vh:
    main: Main.hs
    source-dirs: app
    dependencies:
      - directory
      - filepath
      - haskelui-backend-appkit
      - visual-haskell
      - haskelui-runtime
    build-tools:
      - visual-haskell-analysis-ghc910:visual-haskell-analysis-ghc910
    ghc-options:
      - -Wall
      - -Wcompat
      - -threaded
    when:
      - condition: '!os(darwin)'
        buildable: false

tests:
  vh-debug-logging-test:
    main: LoggingSpec.hs
    source-dirs: test/logging
    dependencies:
      - visual-haskell
  vh-model-test:
    main: ModelSpec.hs
    source-dirs: test/model
    dependencies:
      - visual-haskell
  vh-native-test:
    main: NativeSpec.hs
    source-dirs: test/native
    dependencies:
      - directory
      - haskelui-backend-appkit
      - visual-haskell
      - haskelui-runtime
    when:
      - condition: '!os(darwin)'
        buildable: false
  vh-explorer-native-test:
    main: ExplorerNativeSpec.hs
    source-dirs: test/explorer-native
    dependencies:
      - directory
      - filepath
      - haskelui-backend-appkit
      - visual-haskell
      - visual-haskell-textmate
      - haskelui-runtime
    when:
      - condition: '!os(darwin)'
        buildable: false
  vh-workspace-persistence-test:
    main: WorkspaceSpec.hs
    source-dirs: test/workspace
    dependencies:
      - directory
      - visual-haskell
      - haskelui-runtime
  vh-analysis-service-test:
    main: Spec.hs
    source-dirs: test/analysis-service
    dependencies:
      - directory
      - filepath
      - stm
      - visual-haskell
      - visual-haskell-textmate
      - haskelui-runtime
    build-tools:
      - visual-haskell-analysis-ghc910:visual-haskell-analysis-ghc910
    ghc-options:
      - -threaded
